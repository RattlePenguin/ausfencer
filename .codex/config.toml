# Workspace defaults for Codex and its subagents. Requires permission-profile support.
# Keep sandbox_mode and sandbox_workspace_write unset: they override this profile.
approval_policy = "never"
default_permissions = "ausfencer"

[permissions.ausfencer]
description = "Write within AusFencer and temporary directories; read elsewhere; no escalation prompts."

[permissions.ausfencer.filesystem]
":root" = "read"
"/home/duckye/Projects/ausfencer" = "write"
# Codex protects these subdirectories separately, even under a writable root.
"/home/duckye/Projects/ausfencer/.git" = "write"
"/home/duckye/Projects/ausfencer/.codex" = "write"
"/home/duckye/Projects/ausfencer/.agents" = "write"
"/home/duckye/Projects/ausfencer/.aws" = "write"
":slash_tmp" = "write"
":tmpdir" = "write"

# Direct network access permits the backend server and local HTTP smoke checks.
# Filesystem restrictions still apply to server processes and SQLite databases.
[permissions.ausfencer.network]
enabled = true
