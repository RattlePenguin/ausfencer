<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Fencing Referee Remote & Scoreboard</title>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
	<link href="style.css" rel="stylesheet">
</head>
<body>
	<div id="app">
		<!-- Header / Navigation -->
		<header class="app-header">
			<div class="logo">
				<span class="logo-icon">🤺</span>
				<span class="logo-text">Fencing Tracker</span>
			</div>
			<div class="header-actions">
				<button type="button" class="btn btn-secondary btn-sm" onclick="showNewBoutModal()">+ New Bout</button>
				<button type="button" class="btn btn-secondary btn-sm" onclick="showBoutListModal()">📋 Bouts</button>
			</div>
		</header>

		<!-- Active Bout Scoreboard View -->
		<main class="scoreboard-container">
			<div class="bout-meta-bar">
				<span id="boutWeapon" class="badge badge-weapon">Foil</span>
				<span id="boutStatus" class="badge badge-status">Not Started</span>
			</div>

			<!-- Timer Section -->
			<div class="timer-card">
				<div id="timer" class="timer-display">03:00</div>
				<div class="timer-controls">
					<button type="button" id="startStopBtn" class="btn btn-primary btn-lg" onclick="toggleTimer()">START</button>
					<button type="button" class="btn btn-warning" onclick="resetTimer()">Reset Time</button>
				</div>
			</div>

			<!-- Score Section -->
			<div class="scores-grid">
				<!-- Left Fencer -->
				<div class="fencer-card left-side">
					<h2 id="leftName" class="fencer-name">Fencer 1</h2>
					<div class="score-display-wrapper">
						<div id="leftScore" class="score-num">0</div>
					</div>
					<div class="score-buttons">
						<button type="button" class="btn btn-score btn-add" onclick="changeScore('left', 1)">+1</button>
						<button type="button" class="btn btn-score btn-sub" onclick="changeScore('left', -1)">-1</button>
					</div>
					<div class="card-indicators">
						<button type="button" class="card-btn card-yellow" onclick="addCard('left', 'yellow')">🟨 <span id="leftYellow">0</span></button>
						<button type="button" class="card-btn card-red" onclick="addCard('left', 'red')">🟥 <span id="leftRed">0</span></button>
					</div>
				</div>

				<!-- Right Fencer -->
				<div class="fencer-card right-side">
					<h2 id="rightName" class="fencer-name">Fencer 2</h2>
					<div class="score-display-wrapper">
						<div id="rightScore" class="score-num">0</div>
					</div>
					<div class="score-buttons">
						<button type="button" class="btn btn-score btn-add" onclick="changeScore('right', 1)">+1</button>
						<button type="button" class="btn btn-score btn-sub" onclick="changeScore('right', -1)">-1</button>
					</div>
					<div class="card-indicators">
						<button type="button" class="card-btn card-yellow" onclick="addCard('right', 'yellow')">🟨 <span id="rightYellow">0</span></button>
						<button type="button" class="card-btn card-red" onclick="addCard('right', 'red')">🟥 <span id="rightRed">0</span></button>
					</div>
				</div>
			</div>

			<!-- Footer Action -->
			<div class="bout-actions">
				<button type="button" class="btn btn-danger btn-block" onclick="endBout()">Finish & Save Bout</button>
			</div>
		</main>
	</div>

	<!-- New Bout Modal -->
	<div id="newBoutModal" class="modal">
		<div class="modal-content">
			<h2>Start New Bout</h2>
			<form id="newBoutForm" onsubmit="handleCreateBout(event)">
				<div class="form-group">
					<label for="inputLeftName">Left Fencer Name</label>
					<input type="text" id="inputLeftName" class="form-input" placeholder="e.g. Antoine" required>
				</div>
				<div class="form-group">
					<label for="inputRightName">Right Fencer Name</label>
					<input type="text" id="inputRightName" class="form-input" placeholder="e.g. Ben" required>
				</div>
				<div class="form-group">
					<label for="inputWeapon">Weapon</label>
					<select id="inputWeapon" class="form-input">
						<option value="Foil">Foil</option>
						<option value="Epee">Epee</option>
						<option value="Sabre">Sabre</option>
					</select>
				</div>
				<div class="form-group">
					<label for="inputDuration">Time (Minutes)</label>
					<input type="number" id="inputDuration" class="form-input" value="3" min="1" max="10">
				</div>
				<div class="modal-actions">
					<button type="submit" class="btn btn-primary">Create Bout</button>
					<button type="button" class="btn btn-secondary" onclick="closeModal('newBoutModal')">Cancel</button>
				</div>
			</form>
		</div>
	</div>

	<!-- Bouts History Modal -->
	<div id="boutsListModal" class="modal">
		<div class="modal-content modal-lg">
			<h2>Saved Bouts</h2>
			<div id="boutsList" class="bouts-list">
				<p>Loading bouts...</p>
			</div>
			<div class="modal-actions">
				<button type="button" class="btn btn-secondary" onclick="closeModal('boutsListModal')">Close</button>
			</div>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
